name: SERVICES CI

on:
  push:
    branches: [dev, ci-cd]
    paths:
      - 'services/**'
      - '.github/workflows/services-CI.yml'
  pull_request:
    branches: [dev, ci-cd]
    paths:
      - 'services/**'
      - '.github/workflows/services-CI.yml'

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22.x', '1.23.x', '1.24.x']
    defaults:
      run:
        working-directory: services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build & Test
        run: |
          go build ./...
          go test -v ./... || true
        working-directory: services
        shell: bash
