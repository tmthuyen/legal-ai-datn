name: Backend CD

on:
  push:
    branches: [main, production]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-CD.yml'
  workflow_dispatch:

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-cd:
    # Chạy khi push lên main hoặc production
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    # environment: production
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build check
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e .
          else
            echo "ERROR: pyproject.toml not found"
            exit 1
          fi
        shell: bash

      - name: Detect Dockerfile
        id: docker
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build Docker image
        id: build-docker
        if: steps.docker.outputs.exists == 'true'
        run: |
          echo "Building image..."
          echo "build_docker=true" >> $GITHUB_OUTPUT
        shell: bash

      - name: Deploy
        run: |
          echo "================================"
          echo "Backend CD simulation successful"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "No production server configured"
          echo "================================"
        shell: bash
