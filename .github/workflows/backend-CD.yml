name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-CD.yml'
  workflow_dispatch:

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-cd:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build check
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi
          python -c "import src.api.server; print('BUILD_OK')"
        shell: bash

      - name: Detect Dockerfile
        id: docker
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build Docker image (if exists)
        if: steps.docker.outputs.exists == 'true' && secrets.DOCKER_REGISTRY != ''
        run: |
          echo "Building image..."
        shell: bash

      - name: Deploy (placeholder)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Backend CD: no deploy target configured. Skipping safely."
        shell: bash
